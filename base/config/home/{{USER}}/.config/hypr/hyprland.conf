# Hyprland config — base layer.
# Host layers (LXKA-4JSYDX3, D7JW8FS) ship their own complete hyprland.conf
# with a `monitor=` layout tuned for that machine; everything else below is
# shared and duplicated there intentionally, since cfg deploys base then
# overwrites with the host file rather than merging them.

$mod = SUPER
$terminal = kitty
$launcher = fuzzel

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 4
    gaps_out = 12
    border_size = 2
    col.active_border = rgb(cba6f7)
    col.inactive_border = rgb(45475a)
    layout = dwindle
}

decoration {
    rounding = 8
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

exec-once = wl-paste --watch cliphist store
exec-once = qs

bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $launcher
bind = $mod, Q, killactive,
bind = $mod SHIFT, E, exit,

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bind = $mod, F, fullscreen, 1
bind = $mod SHIFT, F, fullscreen, 0

bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%s).png
