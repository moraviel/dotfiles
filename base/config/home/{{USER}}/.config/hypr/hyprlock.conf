background {
    path = /home/{{USER}}/.wallpapers/catppuccin/mocha/kurzgesagt/Cloudy_Quasar_1-Catppuccin_Mocha.png
    color = rgb(30, 30, 46)
    blur_passes = 2
    blur_size = 4
}

input-field {
    size = 250, 60
    position = 0, -80
    outer_color = rgb(203, 166, 247)
    inner_color = rgb(49, 50, 68)
    font_color = rgb(205, 214, 244)
    placeholder_text = Password
    fade_on_empty = false
}

label {
    text = cmd[update:1000] date '+%H:%M'
    position = 0, 160
    font_size = 64
    font_color = rgb(205, 214, 244)
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date '+%A, %d %B'
    position = 0, 80
    font_size = 20
    font_color = rgb(166, 173, 200)
    halign = center
    valign = center
}
