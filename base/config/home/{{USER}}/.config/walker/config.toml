# Minimal override — everything not set here falls back to Walker's own
# built-in defaults (see resources/config.toml in the walker repo for the
# full option list). Only elephant-desktopapplications, -calc, -runner and
# -files are installed (base/aur-packages), so the provider lists below are
# trimmed to match instead of using the full default set.
theme = "catppuccin-mocha"

[providers]
default = ["desktopapplications", "calc", "runner"]
empty = ["desktopapplications"]

[[providers.prefixes]]
prefix = ">"
provider = "runner"

[[providers.prefixes]]
prefix = "/"
provider = "files"

[[providers.prefixes]]
prefix = "="
provider = "calc"
